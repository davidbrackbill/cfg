# vi stuff
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

set -g status-right '#(~/.tmux/git-status.sh "#{pane_current_path}") %-I:%M '
set -g status-right-length 80
set -g status-position bottom
set -g status-bg "#101018"
set -g status-fg "#dce4ff"

set -g base-index 1
set -g renumber-windows on
set -g automatic-rename off
set-hook -g after-new-window "rename-window '$'"

set -g window-status-format " #{?window_bell_flag,#[fg=#f9e2af],}#{window_index}#{?#{m:??*,#{window_name}}, #{window_name},#{window_name}}#[fg=#cdd6f4] "
set -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #{window_index}#{?#{m:??*,#{window_name}}, #{window_name},#{window_name}} #[bg=#1e1e2e,fg=#cdd6f4,nobold]"
set -g status-left " #{session_name}  "

# Allow nvim color schemes in Tmux
set -g default-terminal "tmux-256color"
set-option -a terminal-features 'screen-256color:RGB' # tried 'xterm-256color:RGB' before, but this seems to work

# Unbind annoying shortcuts
unbind C-BSpace
unbind C-d
set -g mouse on
set -g history-limit 50000

# Small non-zero value: fast enough for nvim ESC, but lets tmux recognize M- (alt) sequences
set -s escape-time 10

# Leader
unbind C-b
set-option -g prefix M-f
bind M-f send-prefix

# Create global shortcuts
bind -n C-t new-window -c "#{pane_current_path}"

# New panes inherit current path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind -n C-w kill-pane
bind -n M-l last-window
bind -n M-s choose-tree 
bind -n M-j previous-window
bind -n M-k next-window
bind -n M-/ copy-mode

# Alt+Num to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 0

# Alt+Shift+Num to move window to position
bind -n M-! move-window -t 1
bind -n M-@ move-window -t 2
bind -n M-# move-window -t 3
bind -n M-$ move-window -t 4
bind -n M-% move-window -t 5
bind -n M-^ move-window -t 6
bind -n M-& move-window -t 7
bind -n M-* move-window -t 8
bind -n M-( move-window -t 9
bind -n M-) move-window -t 0

# Alt+. for move, Alt+, for rename
bind -n M-. command-prompt -p "move window to:" "move-window -t %%"
bind -n M-, command-prompt -p "rename window:" "rename-window %%"

# Reload tmux config
bind r source-file ~/.tmux.conf  

set-environment -g EDITOR nvim

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'artemave/tmux_super_fingers'
set -g @plugin 'loichyan/tmux-toggle-popup'
set -g @popup-on-init 'set -g status off ; bind -n M-g detach'
bind -n M-o new-window -n super-fingers "~/.tmux/plugins/tmux_super_fingers/run.sh"

# Continuum\Resurrect behavior
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Bell notifications via macOS
set -g bell-action any
setw -g monitor-bell on
set -g allow-passthrough on

# Send macOS notification on bell (disabled — use M-h to jump to alerted windows)
set-hook -gu alert-bell

# Dismiss all bell notifications when the terminal regains focus
set-hook -g client-focus-in 'run-shell -b "alerter --remove ALL 2>/dev/null || true"'

# Jump to next alerted window across all sessions
bind -n M-h run-shell '~/.tmux/alert-next.sh'
bind -n M-g run "#{@popup-toggle} -w98% -h98% -Ed'#{pane_current_path}' --name=lazygit-#{pane_id} lazygit"
bind -n M-G run "#{@popup-toggle} -w98% -h98% -Ed'#{pane_current_path}' --name=cfgl-#{pane_id} bash -ic cfgl"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

