onboarding = false

[theme]
name = "catppuccin"

[terminal]
new_cwd = "follow"

[keys]
prefix = "alt+f"
reload_config = "prefix+r"
previous_tab = "alt+j"
next_tab = "alt+k"
new_tab = "ctrl+t"
close_pane = "ctrl+w"
open_notification_target = "alt+h"

[keys.indexed]
tabs = "alt"

[[keys.command]]
key = "alt+g"
type = "pane"
command = "lazygit"
description = "lazygit"

[ui]
mouse_capture = true
sidebar_collapsed_mode = "hidden"
pane_borders = true
pane_gaps = false
agent_panel_sort = "priority"

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

