onboarding = false

[theme]
name = "catppuccin"

[terminal]
new_cwd = "follow"

[keys]
prefix = "alt+f"
reload_config = "prefix+r"
previous_tab = "alt+j"
next_tab = "alt+k"
new_tab = ["ctrl+t", "cmd+t"]
close_pane = "ctrl+w"
close_tab = "cmd+w"
open_notification_target = "alt+h"
new_workspace = "cmd+n"

[keys.indexed]
tabs = "alt"

[[keys.command]]
key = "alt+g"
type = "pane"
command = "lazygit"
description = "lazygit"

# herdr-native port of switch-session.sh — fuzzy-pick/create a workspace
[[keys.command]]
key = "alt+s"
type = "pane"
command = "~/.herdr/switch-workspace.sh"
description = "switch workspace"

# tmux/wt worktree flow — bare-repo aware, not herdr's native new_worktree
[[keys.command]]
key = "prefix+shift+g"
type = "pane"
command = "wt open"
description = "wt open"

[ui]
mouse_capture = true
sidebar_collapsed_mode = "hidden"
pane_borders = true
pane_gaps = false
prompt_new_tab_name = false
agent_panel_sort = "priority"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

